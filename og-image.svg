<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1E1B4B" rx="24"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad)" rx="24"/>
  
  <!-- Central shield icon -->
  <g transform="translate(600, 315)">
    <path d="M0-200 L180-150 L180 60 Q180 160 0 240 Q-180 160 -180 60 L-180 -150 Z" 
          fill="#6366F1" opacity="0.9"/>
    <path d="M0-180 L160-130 L160 55 Q160 145 0 220 Q-160 145 -160 55 L-160 -130 Z" 
          fill="#4F46E5" opacity="0.8"/>
    <!-- Lock/keyhole -->
    <circle cx="0" cy="-20" r="30" fill="#FFFFFF" opacity="0.95"/>
    <rect x="-12" y="15" width="24" height="55" rx="4" fill="#FFFFFF" opacity="0.95"/>
  </g>
  
  <!-- Title text -->
  <text x="600" y="560" font-family="system-ui, -apple-system, sans-serif" 
        font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    Deploy Keycloak on Railway in Minutes
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="595" font-family="system-ui, -apple-system, sans-serif" 
        font-size="18" fill="#A5B4FC" text-anchor="middle">
    Open-source identity &amp; access management • One-click deploy
  </text>
</svg>
